[tool.poetry]
name = "prompt_security"
version = "0.0.0"
description = "steps to safeguard against prompt injection"
authors = ["Rohit Khazanchi"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12.0, <3.14"
pydantic = "^2.13.4"
pydantic-settings = "^2.14.1"
rich = "^15.0.0"
typer = "^0.25.1"
langchain = "^1.3.1"
langchain-google-genai = "^4.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "~8.3.2"
black = "~24.8.0"
isort = "~5.13.2"
pylint = "~3.2.6"
pytest-mock = "~3.14.0"
autopep8 = "~2.3.1"
pre-commit = "~3.8.0"
ruff = "~0.6.3"
pytest-cov = "^7.0.0"
pytest-asyncio = "^1.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "N",  # PEP8 naming convetions
    "D",  # pydocstyle
]
ignore = [
    "C901", # too complex
    "W191", # indentation contains tabs
    "D401", # imperative mood
    "D100", # missing doc string in public module
    "B904",
    "D104",
    "D103"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = "."